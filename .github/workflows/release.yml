name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          WXT_WEB_URL: https://quran.pandusudo.xyz

      - name: Zip
        run: npm run zip
        env:
          WXT_WEB_URL: https://quran.pandusudo.xyz

      - name: Upload artifact to release
        uses: softprops/action-gh-release@v3
        with:
          files: .output/*.zip
          generate_release_notes: true
